<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Antoine Lechasles</title>
  <meta name="description" content="Antoine Lechasles, étudiant en BUT3 Informatique, développeur full-stack. Recherche un stage de fin d'études du 15 février au 4 juin 2027.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/projects.css">
  <link rel="stylesheet" href="assets/css/career-skills.css">
  <link rel="stylesheet" href="assets/css/contact-footer.css">
  <link rel="stylesheet" href="assets/css/accessibility.css">

  <!-- Thème appliqué avant l'affichage (évite le flash blanc) -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>

  <header class="top" id="top">
    <div class="wrap">
      <a class="brand" href="#top" data-text="site.name"></a>
      <nav class="nav" id="nav" data-aria-label="site.mainNavLabel">
        <!-- liens générés depuis content.js -->
        <button class="icon-btn" id="theme" type="button" data-aria-label="site.themeButtonLabel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="accueil">
      <div class="wrap">
        <div class="hero-copy">
          <p class="status"><span class="dot" aria-hidden="true"></span><span data-text="hero.status"></span></p>
          <h1 id="hero-name"></h1>
          <p class="role" data-text="hero.role"></p>
          <p class="lede" data-text="hero.lede"></p>
          <div class="actions" id="hero-actions"></div>

          <div class="stage" data-aria-label="internship.ariaLabel">
            <div class="stage-head">
              <strong data-text="internship.title"></strong>
              <span id="countdown"></span>
            </div>
            <div class="weeks" id="weeks" role="img"></div>
            <div class="stage-dates">
              <span data-text="internship.start.label"></span>
              <span data-text="internship.end.label"></span>
            </div>
            <p class="stage-note" data-text="internship.note"></p>
          </div>
        </div>
        <div class="crystal" id="crystal"></div>
      </div>
    </section>

    <section class="block" id="projets">
      <div class="wrap">
        <div class="sec-head">
          <h2 data-text="projects.title"></h2>
          <p data-text="projects.intro"></p>
        </div>
        <div class="filters" id="filters" role="group" data-aria-label="projects.filtersLabel"></div>
        <div class="grid" id="grid"></div>
        <div class="more" id="github-more"></div>
      </div>
    </section>

    <section class="block" id="parcours">
      <div class="wrap">
        <div class="sec-head"><h2 data-text="career.title"></h2></div>
        <div class="cols">
          <div id="experience"></div>
          <div id="education"></div>
        </div>
      </div>
    </section>

    <section class="block" id="competences">
      <div class="wrap">
        <div class="sec-head">
          <h2 data-text="skills.title"></h2>
          <p data-text="skills.intro"></p>
        </div>
        <dl class="skills" id="skills"></dl>
      </div>
    </section>

    <section class="block" id="contact">
      <div class="wrap contact">
        <div class="contact-copy">
          <h2 data-text="contact.title"></h2>
          <div id="contact-paragraphs" class="contact-paragraphs"></div>
        </div>
        <div class="contact-card">
          <div class="field">
            <small data-text="contact.emailLabel"></small>
            <div class="field-row">
              <span class="email" id="email" data-text="contact.email"></span>
              <button class="copy" id="copy" type="button" data-text="contact.copyLabel"></button>
            </div>
          </div>
          <div class="field">
            <small data-text="contact.githubLabel"></small>
            <a class="link" data-text="contact.githubText" data-href="contact.githubUrl" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <div class="field">
            <small data-text="contact.locationLabel"></small>
            <span data-text="contact.location"></span>
          </div>
          <a class="btn btn-primary btn-mail" id="mail-btn" data-text="contact.mailButton"></a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span data-text="footer.left"></span>
      <span data-text="footer.right"></span>
    </div>
  </footer>

  <!-- Bibliothèque 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>

  <!-- Contenu (tout le texte du site) -->
  <script src="content/content.js" defer></script>

  <!-- Code du site (l'ordre compte) -->
  <script src="assets/js/utils.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/mockups.js" defer></script>
  <script src="assets/js/render-static.js" defer></script>
  <script src="assets/js/projects.js" defer></script>
  <script src="assets/js/career-skills.js" defer></script>
  <script src="assets/js/internship.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/contact.js" defer></script>
  <script src="assets/js/crystal.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
